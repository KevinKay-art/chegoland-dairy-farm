{% extends "base.html" %}

{% block title %}Page Not Found | {{ app_name }}{% endblock %}

{% block content %}
    <section class="section-sm">
        <div class="container">
            <div class="card panel text-center py-20 mx-auto lg:mx-0" style="max-width: 560px;">
                <div class="empty-icon" style="width:80px;height:80px;font-size:40px;background:var(--cg-green-light);color:var(--cg-green-dark);">🐄</div>
                <h1 class="text-6xl font-bold text-pasture-green mb-4">404</h1>
                <p class="text-lg text-gray-600 mb-8">Page Not Found</p>
                <p class="text-gray-500 mb-10">The page you’re looking for isn’t on the farm today.</p>
                <a href="/" class="btn btn--primary btn--lg">Go Home</a>
            </div>
        </div>
    </section>
{% endblock %}
