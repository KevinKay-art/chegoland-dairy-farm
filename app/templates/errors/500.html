{% extends "base.html" %}

{% block title %}Server Error | {{ app_name }}{% endblock %}

{% block content %}
    <section class="section-sm">
        <div class="container">
            <div class="card panel text-center py-20 mx-auto lg:mx-0" style="max-width: 560px;">
                <div class="empty-icon" style="width:80px;height:80px;font-size:40px;background:#FBE9E7;color:var(--cg-error);">⚠️</div>
                <h1 class="text-6xl font-bold text-pasture-green mb-4">500</h1>
                <p class="text-lg text-gray-600 mb-8">Something went wrong</p>
                <p class="text-gray-500 mb-10">We had a problem on our end. Please try again shortly.</p>
                <a href="/" class="btn btn--primary btn--lg">Go Home</a>
            </div>
        </div>
    </section>
{% endblock %}
