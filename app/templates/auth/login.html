<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | {{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        h1, h2 { font-family: 'Poppins', sans-serif; }
        .bg-pasture-green { background-color: #2E7D32; }
        .text-pasture-green { color: #2E7D32; }
        .bg-cream { background-color: #FFF8E7; }
    </style>
</head>
<body class="bg-cream min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-soft border border-gray-100 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-pasture-green rounded-full flex items-center justify-center mx-auto mb-4 text-white font-bold text-xl">C</div>
            <h1 class="text-2xl font-bold text-gray-800">{{ app_name }}</h1>
            <p class="text-gray-600 text-sm">Farm Admin Portal &bull; Kapcholyo, Kaplong and its environs</p>
        </div>
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-6">{{ error }}</div>
        {% endif %}
        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green">
            </div>
            <button type="submit" class="w-full bg-pasture-green text-white py-3 rounded-lg font-bold hover:bg-green-800">Login</button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600">
            Don't have an account? <a href="/register" class="text-pasture-green font-semibold hover:underline">Register</a>
        </p>
    </div>
</body>
</html>
