<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | {{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        .bg-pasture-green { background-color: #2E7D32; }
        .text-pasture-green { color: #2E7D32; }
        .bg-cream { background-color: #FFF8E7; }
    </style>
</head>
<body class="bg-cream text-gray-800 min-h-screen flex flex-col">
    <nav class="bg-white border-b sticky top-0 z-50 shadow-soft">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-pasture-green rounded-full flex items-center justify-center text-white font-bold">C</div>
                <span class="font-poppins font-bold text-xl text-pasture-green">{{ app_name }}</span>
            </div>
            <a href="/cart" class="text-gray-700 hover:text-pasture-green">Back to Cart</a>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
        <div class="bg-white rounded-xl shadow-soft border border-gray-100 p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Checkout</h2>
            <form id="checkoutForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" name="customer_name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input type="tel" name="customer_phone" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" name="customer_email" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Delivery Address</label>
                        <textarea name="delivery_address" rows="2" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green"></textarea>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Delivery Date</label>
                    <input type="date" name="delivery_date" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Delivery Time Slot</label>
                    <select name="delivery_time_slot" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green">
                        <option value="Morning (8am-12pm)">Morning (8am-12pm)</option>
                        <option value="Afternoon (12pm-4pm)">Afternoon (12pm-4pm)</option>
                        <option value="Evening (4pm-8pm)">Evening (4pm-8pm)</option>
                    </select>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h3 class="font-bold mb-4">Payment Method</h3>
                    <div class="space-y-3">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="radio" name="payment_method" value="cash_on_delivery" checked class="text-pasture-green">
                            <span class="text-gray-800">Cash on Delivery</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="radio" name="payment_method" value="mpesa" class="text-pasture-green">
                            <span class="text-gray-800">M-Pesa (STK Push)</span>
                        </label>
                    </div>
                </div>
                <button type="submit" class="w-full bg-pasture-green text-white py-4 rounded-lg font-bold text-lg hover:bg-green-800 transition">Place Order</button>
            </form>
        </div>
    </div>

    <footer class="bg-pasture-green text-white py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-green-200 text-sm">&copy; 2026 {{ app_name }}</p>
        </div>
    </footer>

    <script>
        document.getElementById('checkoutForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            const cart = sessionStorage.getItem('cart') || '{}';
            const res = await fetch('/api/v1/orders', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (result.success) {
                window.location.href = result.redirect;
            } else {
                alert(result.detail || 'Checkout failed');
            }
        };
    </script>
</body>
</html>
