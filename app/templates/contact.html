<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | {{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        .bg-pasture-green { background-color: #2E7D32; }
        .text-pasture-green { color: #2E7D32; }
        .bg-cream { background-color: #FFF8E7; }
    </style>
</head>
<body class="bg-cream text-gray-800 min-h-screen flex flex-col">
    <nav class="bg-white border-b sticky top-0 z-50 shadow-soft">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-pasture-green rounded-full flex items-center justify-center text-white font-bold">C</div>
                <span class="font-poppins font-bold text-xl text-pasture-green">{{ app_name }}</span>
            </div>
            <a href="/" class="text-gray-700 hover:text-pasture-green">Home</a>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16 flex-1">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Contact Us</h1>
        {% if success %}
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6">{{ success }}</div>
        {% endif %}
        <div class="bg-white p-8 rounded-xl shadow-soft border border-gray-100">
            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                        <input type="text" name="name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" name="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                    <input type="tel" name="phone" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                    <textarea name="message" rows="4" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-pasture-green"></textarea>
                </div>
                <button type="submit" class="w-full bg-pasture-green text-white py-3 rounded-lg font-bold hover:bg-green-800">Send Message</button>
            </form>
        </div>
    </div>

    <footer class="bg-pasture-green text-white py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-green-200 text-sm">&copy; 2026 {{ app_name }}</p>
        </div>
    </footer>
</body>
</html>
