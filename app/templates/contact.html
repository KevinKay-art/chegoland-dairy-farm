{% extends "base.html" %}

{% block title %}Contact | {{ app_name }}{% endblock %}

{% block content %}
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16 flex-1">
        <h2 class="text-3xl font-bold text-gray-800 mb-2">Contact Us</h2>
        <p class="text-gray-600 text-sm mb-10">Have a question or want to place a bulk order? We'd love to hear from you.</p>
        {% if success %}
        <div class="alert alert--success" role="alert">{{ success }}</div>
        {% endif %}
        <div class="panel">
            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required class="input" placeholder="e.g. Wanjiku Muthoni">
                    </div>
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required class="input" placeholder="e.g. wanjiku@example.com">
                    </div>
                </div>
                <div class="form-field">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" class="input" placeholder="e.g. 0712345678">
                </div>
                <div class="form-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" required class="input" placeholder="How can we help you?"></textarea>
                </div>
                <button type="submit" class="btn btn--primary btn--lg btn-full">Send Message</button>
            </form>
        </div>
    </div>

{% endblock %}
