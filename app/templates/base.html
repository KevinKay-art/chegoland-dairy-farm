<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        .bg-pasture-green { background-color: #2E7D32; }
        .text-pasture-green { color: #2E7D32; }
        .border-pasture-green { border-color: #2E7D32; }
        .bg-cream { background-color: #FFF8E7; }
        .shadow-soft { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-cream text-gray-800 min-h-screen">
    {% block content %}{% endblock %}
</body>
</html>
